name: Release

on:
  push:
    tags:
      - "v*"

# Avoid double-publish if the same tag is force-pushed during a run
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # contents: write is for the GitHub Release below, nothing else writes to the repo.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      # The GitHub Release is this version's CHANGELOG section. Checked before
      # the publish, so a tag with no section fails with nothing published.
      - name: Release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "] ") == 1 {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"
          printf '\nnpm: https://www.npmjs.com/package/brandmd/v/%s\n' "$v" >> "$RUNNER_TEMP/notes.md"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # Trusted Publishing requires npm CLI >= 11.5.1.
      - run: npm install -g npm@latest

      - run: npm ci

      # Authenticates via npm Trusted Publishing (OIDC) — no long-lived NPM_TOKEN needed.
      # Configure once at https://www.npmjs.com/package/brandmd/access (Trusted Publishers section).
      - run: npm publish --provenance --access public

      # If only this step fails, run the same command by hand; a job rerun
      # would hit npm's refusal to publish the same version twice.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "$(git log -1 --format=%s)" --notes-file "$RUNNER_TEMP/notes.md"
